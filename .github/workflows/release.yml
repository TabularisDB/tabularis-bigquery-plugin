name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  ui:
    name: UI bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            ui/pnpm-lock.yaml
            explain/pnpm-lock.yaml
      - run: pnpm --dir ui install --frozen-lockfile
      - run: pnpm --dir ui typecheck
      - run: pnpm --dir ui build
      - run: pnpm --dir explain install --frozen-lockfile
      - run: pnpm --dir explain typecheck
      - run: pnpm --dir explain test
      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist/
      - uses: actions/upload-artifact@v7
        with:
          name: explain-dist
          path: explain/dist/index.iife.js

  build:
    name: ${{ matrix.platform-label }}
    needs: ui
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform-label: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary-suffix: ""
          - platform-label: linux-arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary-suffix: ""
            cross: true
          - platform-label: darwin-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            binary-suffix: ""
          - platform-label: darwin-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            binary-suffix: ""
          - platform-label: win-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary-suffix: ".exe"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build with cross
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Build
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist/
      - uses: actions/download-artifact@v8
        with:
          name: explain-dist
          path: explain/dist/
      - name: Package on Unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging/ui/dist staging/explain/dist
          cp target/${{ matrix.target }}/release/bigquery-plugin${{ matrix.binary-suffix }} staging/
          cp .tabularium staging/
          cp ui/dist/*.js staging/ui/dist/
          cp explain/dist/index.iife.js staging/explain/dist/
          (cd staging && zip -r ../bigquery-plugin-${{ matrix.platform-label }}.zip .)
      - name: Package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "staging\ui\dist" | Out-Null
          New-Item -ItemType Directory -Force -Path "staging\explain\dist" | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\bigquery-plugin${{ matrix.binary-suffix }}" staging
          Copy-Item ".tabularium" staging
          Copy-Item "ui\dist\*.js" "staging\ui\dist"
          Copy-Item "explain\dist\index.iife.js" "staging\explain\dist"
          Compress-Archive -Path "staging\*" -DestinationPath "bigquery-plugin-${{ matrix.platform-label }}.zip"
      - name: Smoke test on Unix
        if: runner.os != 'Windows' && !matrix.cross
        run: |
          response=$(echo '{"jsonrpc":"2.0","method":"initialize","id":1}' | ./staging/bigquery-plugin)
          echo "$response" | jq -e '.result == null and .id == 1' > /dev/null
      - name: Smoke test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $response = '{"jsonrpc":"2.0","method":"initialize","id":1}' | & ".\staging\bigquery-plugin.exe"
          $parsed = $response | ConvertFrom-Json
          if ($null -ne $parsed.error -or $parsed.id -ne 1) { exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: bigquery-plugin-${{ matrix.platform-label }}
          path: bigquery-plugin-${{ matrix.platform-label }}.zip
          retention-days: 1

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.zip
            .tabularium
