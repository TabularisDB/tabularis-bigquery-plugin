[package]
name = "bigquery-plugin"
version = "0.2.0"
edition = "2021"
description = "Google BigQuery driver plugin for Tabularis"
license = "Apache-2.0"
publish = false

[[bin]]
name = "bigquery-plugin"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gcp_auth = "0.12.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
